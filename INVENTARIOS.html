function ZcomputeReal(r){
  if(r.pasillo===null && r.bodega===null){ r.real = null; }
  else { r.real = Math.round(((r.pasillo||0) + (r.bodega||0))*10000000000)/10000000000; }
}
function ZsetCampo(st, idx, campo, val){
  const r = st.productos[idx];
  const v = parseNum(val);
  r[campo] = (val==='' || val===null || isNaN(v)) ? null : v;
  ZcomputeReal(r);
  r.diferencia = r.real===null ? null : Math.round((r.real - r.existencia)*10000000000)/10000000000;
}

function ZrenderCaptureBody(st, filterQ){
  const body = document.getElementById('zCaptureBody');
  if(!body) return;
  const capturados = st.productos.filter(r=>r.real!==null).length;
  const total = st.productos.length;

  if(st.captureMode==='tabla'){
    let rows = st.productos;
    if(filterQ) rows = rows.filter(r=>r.nombre.toUpperCase().includes(filterQ));
    let lineaAnterior = null;
    const filas = [];
    rows.forEach(r=>{
      if(r.linea !== lineaAnterior){
        filas.push(`<tr><td colspan="6" style="background:var(--green-pale); color:var(--green-deep); font-weight:700; padding:6px 10px;">${r.linea || 'Sin línea'}</td></tr>`);
        lineaAnterior = r.linea;
      }
      const gi = st.productos.indexOf(r);
      filas.push(`<tr>
        <td>${r.nombre}</td><td>${r.clave}</td>
        <td class="num-cell">${fmtNum(r.existencia)}</td>
        <td class="num-cell"><input type="text" data-idx="${gi}" data-campo="pasillo" class="zCampoInput" style="width:64px;" value="${r.pasillo===null?'':fmtNum(r.pasillo)}"></td>
        <td class="num-cell"><input type="text" data-idx="${gi}" data-campo="bodega" class="zCampoInput" style="width:64px;" value="${r.bodega===null?'':fmtNum(r.bodega)}"></td>
        <td class="num-cell">${r.diferencia===null?'':fmtNum(r.diferencia)}</td>
      </tr>`);
    });
    body.innerHTML = `
      <div class="progress-bar"><div class="fill" style="width:${(capturados/total*100).toFixed(0)}%"></div></div>
      <div class="scroll"><table>
        <thead><tr><th>Producto</th><th>Clave</th><th class="num-cell">Teórico</th><th class="num-cell">Pasillo</th><th class="num-cell">Bodega</th><th class="num-cell">Dif.</th></tr></thead>
        <tbody>${filas.join('')}</tbody>
      </table></div>
    `;
    body.querySelectorAll('.zCampoInput').forEach((inp, pos)=>{
      inp.addEventListener('change', (e)=>{ ZsetCampo(st, parseInt(e.target.dataset.idx,10), e.target.dataset.campo, e.target.value); keepTableView(body, ()=>ZrenderCaptureBody(st, filterQ)); });
      inp.addEventListener('keydown', (e)=>{
        if(e.key==='Tab'){
          e.preventDefault();
          ZsetCampo(st, parseInt(inp.dataset.idx,10), inp.dataset.campo, inp.value);
          keepTableView(body, ()=>ZrenderCaptureBody(st, filterQ), {selector:'.zCampoInput', focusPos: e.shiftKey ? pos-1 : pos+1});
        }
      });
    });
    return;
  }

  const i = st.captureIndex;
  const r = st.productos[i];
  const diffPreview = r.real===null ? null : Math.round((r.real - r.existencia)*10000000000)/10000000000;
  body.innerHTML = `
    <div class="progress-bar"><div class="fill" style="width:${((i+1)/total*100).toFixed(0)}%"></div></div>
    <div class="capture">
      <div style="text-align:center;">
        <span class="clave-tag">CLAVE ${r.clave}</span>
        <div class="nombre">${r.nombre}</div>
        <div class="sistema">${r.linea?r.linea+' · ':''}Teórico: ${fmtNum(r.existencia)} ${r.unidad||''} · Producto ${i+1} de ${total}</div>
      </div>
      <div>
        <div style="display:flex; gap:10px;">
          <div style="flex:1;"><label class="f" style="text-align:center;">Pasillo</label><input type="text" inputmode="decimal" class="real" id="zPasilloBox" placeholder="0" value="${r.pasillo===null?'':fmtNum(r.pasillo)}"></div>
          <div style="flex:1;"><label class="f" style="text-align:center;">Bodega</label><input type="text" inputmode="decimal" class="real" id="zBodegaBox" placeholder="0" value="${r.bodega===null?'':fmtNum(r.bodega)}"></div>
        </div>
        <div class="resta ${diffPreview>0?'neg':diffPreview<0?'pos':''}" id="zDiffPreview">${diffPreview===null?'&nbsp;':(diffPreview>0?'ENTRADA: ':diffPreview<0?'SALIDA: ':'SIN DIFERENCIA')+(diffPreview!==0?fmtNum(Math.abs(diffPreview)):'')}</div>
      </div>
      <div class="navrow">
        <button class="btn secondary" id="zBtnAnterior" ${i===0?'disabled':''}>← Anterior</button>
        <button class="btn" id="zBtnSiguiente">${i===total-1?'Finalizar':'Siguiente →'}</button>
      </div>
    </div>
  `;
  const pasilloBox = document.getElementById('zPasilloBox');
  const bodegaBox = document.getElementById('zBodegaBox');
  const preview = document.getElementById('zDiffPreview');
  pasilloBox.focus(); pasilloBox.select();
  function livePreview(){
    const p = parseNum(pasilloBox.value); const b = parseNum(bodegaBox.value);
    if(isNaN(p) && isNaN(b)){ preview.innerHTML = '&nbsp;'; preview.className='resta'; return; }
    const real = (isNaN(p)?0:p) + (isNaN(b)?0:b);
    const diff = Math.round((real - r.existencia)*10000000000)/10000000000;
    preview.textContent = (diff>0?'ENTRADA: ':diff<0?'SALIDA: ':'SIN DIFERENCIA')+(diff!==0?fmtNum(Math.abs(diff)):'');
    preview.className = 'resta ' + (diff>0?'neg':diff<0?'pos':'');
  }
  pasilloBox.addEventListener('input', livePreview);
  bodegaBox.addEventListener('input', livePreview);
  pasilloBox.addEventListener('keydown', (e)=>{ if(e.key==='Enter'){ e.preventDefault(); ZsetCampo(st, i, 'pasillo', pasilloBox.value); bodegaBox.focus(); bodegaBox.select(); } });
  bodegaBox.addEventListener('keydown', (e)=>{ if(e.key==='Enter'){ e.preventDefault(); goNext(); } });
  document.getElementById('zBtnSiguiente').onclick = goNext;
  document.getElementById('zBtnAnterior').onclick = ()=>{ guardarAmbos(); if(i>0){ st.captureIndex--; ZrenderCaptureBody(st); } };
  function guardarAmbos(){
    ZsetCampo(st, i, 'pasillo', pasilloBox.value);
    ZsetCampo(st, i, 'bodega', bodegaBox.value);
  }
  function goNext(){
    guardarAmbos();
    if(i < total-1){ st.captureIndex++; ZrenderCaptureBody(st); }
    else { ZfinishBanner(st); }
  }
}

        <tbody>${entradas.map(r=>`<tr><td>${r.clave}</td><td>${r.nombre}</td><td class="num-cell">${fmtNum(r.diferencia)}</td></tr>`).join('')}</tbody></table></div>
      </div>
      <div>
        <button class="btn" id="zBtnDescargarSalidas" ${!salidas.length?'disabled':''}>Descargar Salida_${nombre}_${fechaHoy()}.xlsx</button>
        <div class="scroll" style="margin-top:8px; max-height:220px;"><table><thead><tr><th>Clave</th><th>Producto</th><th class="num-cell">Cant.</th></tr></thead>
        <tbody>${salidas.map(r=>`<tr><td>${r.clave}</td><td>${r.nombre}</td><td class="num-cell">${fmtNum(Math.abs(r.diferencia))}</td></tr>`).join('')}</tbody></table></div>
      </div>
    </div>
  `;
  document.getElementById('zBtnDescargarEntradas').onclick = ()=>Zdescargar(entradas, 'Entrada_'+nombre+'_'+fechaHoy()+'.xlsx', r=>r.diferencia);
  document.getElementById('zBtnDescargarSalidas').onclick = ()=>Zdescargar(salidas, 'Salida_'+nombre+'_'+fechaHoy()+'.xlsx', r=>Math.abs(r.diferencia));
}
function Zdescargar(rows, filename, cantFn){
  const aoa = [[]];
  rows.forEach(r=> aoa.push([r.clave, cantFn(r)]));
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  const wb = XLSX.utils.book_new();

  XLSX.writeFile(wb, filename);
}

window.addEventListener('beforeunload', (e)=>{
  const hayCaptura =
    (state.verdura.rows||[]).some(r=>r.real!==null) ||
    (state.miercoles.productos||[]).some(r=>r.real!==null) ||
    (state.negativos.productos||[]).some(r=>r.real!==null) ||

    (state.tarima.dano.length + state.tarima.caducidad.length) > 0;
  if(hayCaptura){ e.preventDefault(); e.returnValue = ''; }
});

render();

<script id="capa-visual-js">
/* ===== CAPA VISUAL v4.2 — animaciones. Envuelve render() sin cambiar nada de la lógica. =====
   Reglas: solo transform y opacity, 120–300 ms, se cancela si el usuario va rápido,
   respeta "reducir movimiento" y NUNCA anima mientras se captura en las tablas
   (solo al entrar a un proceso o cambiar de paso). */
(function(){
  'use strict';
  if(typeof render !== 'function' || typeof state === 'undefined') return;

  var EASE = 'cubic-bezier(0.22, 1, 0.36, 1)';
  var running = [];
  var restores = [];
  var lastKey = '';
  var prevPos = {};

  function reduced(){
    try{ return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); }catch(e){ return false; }
  }
  function canAnimate(){ return !reduced() && typeof Element.prototype.animate === 'function'; }

  function keyNow(){
    try{
      var s = state[state.proceso];
      return state.proceso + ':' + ((s && s.step) || 0);
    }catch(e){ return ''; }
  }

  function run(el, frames, opts){
    try{
      var a = el.animate(frames, opts);
      running.push(a);
      return a;
    }catch(e){ return null; }
  }
  function cancelAll(){
    running.forEach(function(a){ try{ a.cancel(); }catch(e){} });
    running = [];
    restores.forEach(function(f){ try{ f(); }catch(e){} });
    restores = [];
  }

  /* ---------- píldora deslizante (menú lateral y pasos) ---------- */
  function snapshot(){
    ['procTabs','rail'].forEach(function(id){
      var c = document.getElementById(id);
      var b = c && c.querySelector('button.active');
      prevPos[id] = b ? {x:b.offsetLeft, y:b.offsetTop} : null;
    });
  }
  function placePill(id, animate){
    var c = document.getElementById(id);
    if(!c) return;
    var b = c.querySelector('button.active');
    var s = c.querySelector(':scope > .slide-pill');
    if(!b){ if(s) s.remove(); return; }
    if(!s){
      s = document.createElement('span');
      s.className = 'slide-pill';
      c.insertBefore(s, c.firstChild);
    }
    var x = b.offsetLeft, y = b.offsetTop;
    s.style.left = x + 'px'; s.style.top = y + 'px';
    s.style.width = b.offsetWidth + 'px'; s.style.height = b.offsetHeight + 'px';
    var p = prevPos[id];
    if(animate && p && (p.x !== x || p.y !== y) && canAnimate()){
      var dx = p.x - x, dy = p.y - y;
      run(s, [
        {transform:'translate(' + dx + 'px,' + dy + 'px) scale(1,1)'},
        {transform:'translate(' + (dx/2) + 'px,' + (dy/2) + 'px) scale(1.04,1.12)', offset:.5},
        {transform:'translate(0,0) scale(1,1)'}
      ], {duration:300, easing:EASE});
    }
  }

  /* ---------- título palabra por palabra ---------- */
  function splitWords(h){
    if(!h || h.children.length || h.getAttribute('data-split')) return [];
    var words = (h.textContent || '').trim().split(/\s+/);
    if(words.length < 2) return [];
    h.setAttribute('data-split', '1');
    h.textContent = '';
    var spans = [];
    words.forEach(function(w, i){
      var sp = document.createElement('span');
      sp.className = 'w';
      sp.textContent = w;
      h.appendChild(sp);
      if(i < words.length - 1) h.appendChild(document.createTextNode(' '));
      spans.push(sp);
    });
    return spans;
  }

  /* ---------- contadores (300 ms, ease-out) ---------- */
  function countUp(el){
    if(el.children.length) return;
    var orig = el.textContent;
    var m = orig.trim().match(/^(\$?)(-?\d[\d,]*(?:\.\d+)?)(.*)$/);
    if(!m) return;
    var target = parseFloat(m[2].replace(/,/g, ''));
    if(!isFinite(target) || target === 0) return;
    var dec = (m[2].split('.')[1] || '').length;
    var group = m[2].indexOf(',') >= 0;
    var t0 = performance.now(), raf = 0;
    function fmt(v){
      return m[1] + v.toLocaleString('en-US', {minimumFractionDigits:dec, maximumFractionDigits:dec, useGrouping:group}) + m[3];
    }
    function tick(now){
      var p = Math.min((now - t0) / 300, 1);
      var e = 1 - Math.pow(1 - p, 3);
      if(p < 1){ el.textContent = fmt(target * e); raf = requestAnimationFrame(tick); }
      else { el.textContent = orig; }
    }
    restores.push(function(){ cancelAnimationFrame(raf); el.textContent = orig; });
    el.textContent = fmt(0);
    raf = requestAnimationFrame(tick);
  }

  /* ---------- entrada del contenido ---------- */
  function enter(panel){
    if(!panel || !canAnimate()) return;
    var title = panel.querySelector('h2');
    var spans = splitWords(title);
    var delay = 0;
    spans.forEach(function(sp, i){
      run(sp, [{opacity:0, transform:'translateY(8px)'}, {opacity:1, transform:'translateY(0)'}],
          {duration:260, delay:i*60, easing:EASE, fill:'backwards'});
    });
    delay = spans.length ? Math.min(spans.length * 60, 240) : 0;

    var i = 0;
    Array.prototype.forEach.call(panel.children, function(ch){
      if(ch.classList && ch.classList.contains('homeGrid')){
        Array.prototype.forEach.call(ch.children, function(card, j){
          run(card, [{opacity:0, transform:'translateY(14px) scale(.97)'}, {opacity:1, transform:'translateY(0) scale(1)'}],
              {duration:280, delay:delay + j*55, easing:EASE, fill:'backwards'});
        });
        return;
      }
      if(title && (ch === title || ch.contains(title))) return;
      run(ch, [{opacity:0, transform:'translateY(10px)'}, {opacity:1, transform:'translateY(0)'}],
          {duration:260, delay:delay + Math.min(i,8)*60, easing:EASE, fill:'backwards'});
      i++;
    });
    Array.prototype.forEach.call(panel.querySelectorAll('.stat .n'), countUp);
  }

  /* ---------- envoltura de render() ---------- */
  var original = render;
  window.render = render = function(){
    cancelAll();
    snapshot();
    var out = original.apply(this, arguments);
    var k = keyNow();
    var changed = k !== lastKey;
    lastKey = k;
    placePill('procTabs', changed);
    placePill('rail', changed);
    if(changed) enter(document.getElementById('panel'));
    return out;
  };

  /* ---------- primera carga ---------- */
  lastKey = keyNow();
  placePill('procTabs', false);
  placePill('rail', false);
  if(canAnimate()){
    var side = document.querySelector('.sidebar');
    if(side) run(side, [{opacity:0, transform:'translateX(-16px)'}, {opacity:1, transform:'translateX(0)'}],
                 {duration:300, easing:EASE, fill:'backwards'});
    var bc = document.getElementById('breadcrumb');
    if(bc) run(bc, [{opacity:0, transform:'translateY(-6px)'}, {opacity:1, transform:'translateY(0)'}],
               {duration:260, delay:80, easing:EASE, fill:'backwards'});
    enter(document.getElementById('panel'));
  }
  window.addEventListener('resize', function(){ placePill('procTabs', false); placePill('rail', false); });
})();
</script>
</body>
</html>
