<meta name="theme-color" content="#1B4332">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#F5F6F7; --card:#FFFFFF; --ink:#2B2F2C; --ink-soft:#6B6B6B;
    --green:#2F6844; --green-deep:#1B4332; --green-pale:#EAF4EE;
    --orange:#F2994A; --orange-deep:#D9782B; --orange-pale:#FDF0E3;
    --tomato:#B23A2E; --tomato-pale:#FCEAE5;
    --line:#D9D9D9; --line-soft:#EDEDED;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg); color:var(--ink); font-family:'Inter', sans-serif; font-size:13.5px; line-height:1.5; min-height:100vh;}
  h1,h2,h3{font-family:'Inter', sans-serif; font-weight:700; margin:0 0 4px 0; color:var(--green-deep);}
  h2{font-size:16px;} h3{font-size:14px;}
  .shell{display:flex; min-height:100vh; align-items:stretch;}
  .sidebar{width:180px; flex:none; background:var(--green-deep); padding:16px 12px; display:flex; flex-direction:column; gap:2px;}
  .sidebar .brand{display:flex; align-items:center; gap:9px; margin-bottom:16px; padding:0 8px;}
  .sidebar .brand .logo{width:26px; height:26px; flex:none;}
  .sidebar .brand span{font-family:'Inter', sans-serif; font-weight:700; font-size:14px; color:#fff;}
  .main{flex:1; min-width:0;}
  .app{max-width:920px; margin:0 auto; padding:20px 24px 60px;}
  .breadcrumb{font-size:11.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.03em; margin-bottom:10px; font-weight:600;}
  .breadcrumb .sep{margin:0 5px; color:var(--line);}
  .breadcrumb .current{color:var(--green-deep);}
  .procTabs{display:flex; flex-direction:column; gap:2px;}
  .procTabs button{
    all:unset; cursor:pointer; font-family:'Inter', sans-serif; font-size:12.5px; font-weight:600;
    padding:9px 11px; border-radius:0 3px 3px 0; border-left:3px solid transparent; color:#B9D2C1;
  }
  .procTabs button.active{background:rgba(255,255,255,0.14); border-left-color:var(--orange); color:#fff;}
  .procTabs button.locked{opacity:0.45; cursor:not-allowed;}
  @media (max-width:780px){
    .shell{flex-direction:column;}
    .sidebar{width:100%; flex-direction:row; align-items:center; padding:10px 14px; overflow-x:auto;}
    .sidebar .brand{margin-bottom:0; margin-right:6px;}
    .procTabs{flex-direction:row;}
    .procTabs button{border-left:none; border-bottom:3px solid transparent; border-radius:3px 3px 0 0; white-space:nowrap;}
    .procTabs button.active{border-left-color:transparent; border-bottom-color:var(--orange);}
  }
  .layout{display:grid; grid-template-columns:150px 1fr; gap:18px;}
  @media (max-width:680px){.layout{grid-template-columns:1fr;} .rail{display:flex; flex-direction:row; gap:8px; overflow-x:auto;}}
  .rail{display:flex; flex-direction:column; gap:2px;}
  .rail button{all:unset; cursor:pointer; display:flex; align-items:center; gap:9px; padding:9px 9px; font-family:'Inter', sans-serif; font-size:12.5px; font-weight:600; color:var(--ink-soft); border-left:3px solid var(--line); white-space:nowrap; border-radius:0 3px 3px 0;}
  .rail button .num{font-family:'Inter', sans-serif; font-weight:700; font-size:13px; width:18px; color:inherit;}
  .rail button.active{color:var(--green-deep); background:var(--green-pale); border-left:3px solid var(--orange);}
  .rail button.done{color:var(--green);}
  .rail button.locked{opacity:0.4; cursor:not-allowed;}
  .panel{background:var(--card); border:1px solid var(--line); border-radius:3px; padding:20px;}
  .panel p.lead{color:var(--ink-soft); margin-top:0; font-size:13px;}
  .step-title{display:flex; align-items:baseline; gap:10px; margin-bottom:4px;}
  .btn{font-family:'Inter', sans-serif; font-size:12.5px; font-weight:600; padding:8px 16px; border-radius:3px; border:1px solid var(--green-deep); background:var(--green); color:#fff; cursor:pointer;}
  .btn:hover{background:var(--green-deep);}
  .btn:disabled{opacity:0.4; cursor:not-allowed;}
  .btn.secondary{background:#fff; color:var(--green-deep); border:1px solid var(--line);}
  .btn.secondary:hover{border-color:var(--green);}
  .btn.danger{background:var(--tomato); border-color:#8A241B; color:#fff;}
  .btn.small{padding:5px 10px; font-size:11.5px; border-radius:3px;}
  input[type=file]{font-family:'Inter', sans-serif; font-size:13px;}
  select, input[type=text], input[type=number]{font-family:'Inter', sans-serif; font-size:13px; padding:6px 9px; border:1px solid #B4B4B4; border-radius:2px; background:#fff; color:var(--ink);}
  select:focus, input:focus{outline:2px solid var(--orange); outline-offset:0;}
  label.f{display:block; font-size:11.5px; font-weight:600; color:var(--ink-soft); margin-bottom:4px; text-transform:uppercase; letter-spacing:.02em;}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin:16px 0;}
  @media (max-width:560px){.grid2{grid-template-columns:1fr;}}
  .callout{border:1px solid var(--line); border-left:3px solid var(--green); background:var(--green-pale); border-radius:2px; padding:10px 13px; font-size:12.5px; color:var(--green-deep); margin:14px 0;}
  .callout.warn{border-color:var(--line); border-left-color:var(--orange-deep); background:var(--orange-pale); color:var(--orange-deep);}
  .callout.bad{border-color:var(--line); border-left-color:#8A241B; background:var(--tomato-pale); color:#8A241B;}
  table{width:100%; border-collapse:collapse; font-size:12.5px;}
  th{text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); color:#3D3D3D; font-weight:700; position:sticky; top:0; background:#F5F6F7;}
  td{padding:7px 10px; border-bottom:1px solid var(--line-soft);}
  tr.flag td{background:var(--orange-pale);}
  tr.rowMerma td{background:var(--tomato-pale);}
  tr.rowAjuste td{background:var(--orange-pale);}
  .num-cell{font-variant-numeric:tabular-nums; text-align:right;}
  .scroll{max-height:340px; overflow-y:auto; border:1px solid var(--line);}
  .capture{display:grid; grid-template-columns:1fr; gap:18px; max-width:480px; margin:0 auto;}
  .capture .clave-tag{display:inline-block; font-size:11.5px; font-weight:600; color:var(--ink-soft); border:1px solid var(--line); padding:3px 9px; border-radius:2px;}
  .capture .nombre{font-family:'Inter', sans-serif; font-size:19px; font-weight:700; margin:8px 0 2px; color:var(--green-deep);}
  .capture .sistema{color:var(--ink-soft); font-size:12.5px;}
  .capture input[type=text].real{font-size:30px; text-align:center; padding:14px; width:100%; font-family:'Inter', sans-serif; font-weight:700; border-radius:3px;}
  .capture .resta{text-align:center; font-size:15px; font-weight:700; margin-top:6px;}
  .capture .resta.pos{color:var(--tomato);}
  .capture .resta.neg{color:var(--green);}
  .capture .navrow{display:flex; justify-content:space-between; gap:10px;}
  .progress-bar{height:4px; background:var(--line-soft); overflow:hidden; margin-bottom:16px;}
  .progress-bar .fill{height:100%; background:var(--orange);}
  .toolbar{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; align-items:center;}
  .toolbar .spacer{flex:1;}
  .pill{font-size:11px; font-weight:700; border:none; border-radius:2px; padding:3px 9px; color:var(--ink-soft); display:inline-block; background:var(--line-soft);}
  .pill.green{color:#1F5C34; background:var(--green-pale);}
  .pill.amber{color:#8A5A16; background:var(--orange-pale);}
  .pill.tomato{color:#8A241B; background:var(--tomato-pale);}
  .stats-row{display:grid; grid-template-columns:repeat(auto-fit, minmax(120px,1fr)); gap:1px; background:var(--line); border:1px solid var(--line); margin:14px 0;}
  .stat{background:#fff; padding:10px 14px;}
  .stat .n{font-family:'Inter', sans-serif; font-size:20px; font-weight:700; color:var(--green-deep);}
  .stat .l{font-size:11px; color:var(--ink-soft); font-weight:600; text-transform:uppercase; letter-spacing:.02em;}
  footer{margin-top:34px; font-size:12px; color:var(--ink-soft); border-top:1px solid var(--line); padding-top:14px;}

<style id="capa-visual">
/* ===== CAPA VISUAL v4.2 — solo apariencia. No toca la lógica del programa. ===== */
:root{
  --bg:#F4F5F7;
  --r-card:22px; --r-ctl:12px; --r-pill:999px;
  --sh-card:0 1px 2px rgba(16,24,40,.04), 0 8px 24px rgba(16,24,40,.06);
  --sh-lift:0 2px 4px rgba(16,24,40,.05), 0 14px 32px rgba(16,24,40,.10);
  --ease-out:cubic-bezier(0.22, 1, 0.36, 1);
  --accent-grad:linear-gradient(135deg,#F2994A 0%,#D9782B 100%);
}
body{background:var(--bg); font-size:14px; letter-spacing:-.003em;}
h1,h2,h3{letter-spacing:-.015em;}
h2{font-size:18px;}

/* --- estructura flotante --- */
.shell{padding:16px; gap:16px;}
.sidebar{
  width:212px; padding:18px 12px; gap:4px; border-radius:26px;
  position:sticky; top:16px; align-self:flex-start; height:calc(100vh - 32px); overflow-y:auto;
  box-shadow:0 10px 30px rgba(27,67,50,.22);
}
.sidebar .brand{margin-bottom:18px; padding:2px 10px;}
.sidebar .brand .logo{width:30px; height:30px;}
.sidebar .brand span{font-size:15px; letter-spacing:-.01em;}
.app{max-width:980px; padding:6px 8px 60px;}
.layout{gap:20px; grid-template-columns:176px 1fr;}

/* --- migas de pan como píldora --- */
.breadcrumb{
  display:inline-flex; align-items:center; background:#fff; border-radius:var(--r-pill);
  padding:7px 16px; box-shadow:var(--sh-card); margin-bottom:16px; text-transform:none;
  letter-spacing:0; font-size:12.5px;
}
.breadcrumb .current{color:var(--green-deep); font-weight:700;}

/* --- menú lateral con píldora deslizante --- */
.procTabs{position:relative; gap:3px;}
.procTabs button{
  position:relative; z-index:1; display:block; border-left:none; border-radius:14px;
  padding:10px 14px; color:#B9D2C1; font-size:13px;
  transition:color .18s var(--ease-out), transform .12s var(--ease-out);
}
.procTabs button:hover{color:#fff;}
.procTabs button:active{transform:scale(.97);}
.procTabs button.active{background:transparent; border-left-color:transparent; color:#1B4332;}
.procTabs .slide-pill{background:var(--accent-grad); box-shadow:0 4px 12px rgba(217,120,43,.35);}

/* --- pasos del proceso con indicador deslizante --- */
.rail{position:relative; gap:4px;}
.rail button{
  position:relative; z-index:1; border-left:none; border-radius:14px; padding:10px 12px;
  transition:color .18s var(--ease-out), transform .12s var(--ease-out);
}
.rail button:not(.locked):active{transform:scale(.97);}
.rail button.active{background:transparent; border-left:none; color:var(--green-deep);}
.rail .slide-pill{background:#fff; box-shadow:var(--sh-card); border:1px solid #E3EDE6;}
.rail button .num{
  width:22px; height:22px; border-radius:50%; background:var(--line-soft); color:var(--ink-soft);
  display:inline-flex; align-items:center; justify-content:center; font-size:11.5px; flex:none;
}
.rail button.active .num{background:var(--accent-grad); color:#1B4332;}
.rail button.done .num{background:var(--green-pale); color:var(--green);}

.slide-pill{position:absolute; top:0; left:0; pointer-events:none; z-index:0; border-radius:14px; will-change:transform;}

/* --- tarjeta principal --- */
.panel{border:none; border-radius:var(--r-card); padding:26px; box-shadow:var(--sh-card);}
.step-title h2{font-size:20px;}
.panel h2 .w{display:inline-block;}

/* --- controles --- */
.btn{border-radius:var(--r-ctl); padding:9px 18px; transition:transform .12s var(--ease-out), background .15s;}
.btn:active:not(:disabled){transform:scale(.97);}
.btn.small{border-radius:10px; padding:6px 12px;}
.btn.secondary{border-color:#E1E4E8;}
select, input[type=text], input[type=number]{border-radius:10px; border-color:#D5D9DE; padding:7px 11px;}
select:focus, input:focus{outline-offset:1px; border-radius:10px;}
.callout{border-radius:14px; border:none; border-left:4px solid var(--green); padding:12px 16px;}
.callout.warn{border-left-color:var(--orange-deep);}
.callout.bad{border-left-color:#8A241B;}
.pill{border-radius:var(--r-pill); padding:3px 11px;}
input[type=file]{padding:14px; border:1.5px dashed #CBD5CE; border-radius:16px; width:100%; background:#FAFBFA;}

/* --- tablas: se mantienen densas para capturar --- */
.scroll{border:1px solid #E6E8EB; border-radius:16px;}
th{background:#F7F8F9; border-bottom:1px solid #E6E8EB;}
td input[type=text], td input[type=number], td select{padding:5px 9px; border-radius:8px;}

/* --- captura uno por uno --- */
.capture input[type=text].real{border-radius:18px; border:2px solid #E1E4E8;}
.capture input[type=text].real:focus{border-color:var(--orange); outline:none; box-shadow:0 0 0 4px rgba(242,153,74,.2);}
.capture .clave-tag{border-radius:var(--r-pill);}

/* --- progreso con rayas diagonales --- */
.progress-bar{height:8px; border-radius:var(--r-pill); background:#EEF0F2;}
.progress-bar .fill{
  border-radius:var(--r-pill);
  background:repeating-linear-gradient(45deg,#F2994A 0 8px,#E9893A 8px 16px);
  transition:width .3s var(--ease-out);
}

/* --- KPIs como tarjetas; la primera con el acento --- */
.stats-row{background:transparent; border:none; gap:12px; margin:16px 0;}
.stat{border-radius:18px; padding:16px 18px; box-shadow:var(--sh-card);}
.stat .n{font-size:26px; font-weight:700; font-variant-numeric:tabular-nums; letter-spacing:-.02em;}
.stat:first-child{background:var(--accent-grad); box-shadow:0 10px 24px rgba(217,120,43,.28);}
.stat:first-child .n, .stat:first-child .l{color:#1B4332;}
.stat:first-child .n{color:#143324 !important;}

/* --- inicio --- */
.homeGrid{gap:14px; margin-top:20px;}
.homeCard{
  border:none; border-radius:var(--r-card); padding:18px; box-shadow:var(--sh-card);
  transition:transform .22s var(--ease-out), box-shadow .22s var(--ease-out);
}
.homeCard:hover{transform:translateY(-5px); box-shadow:var(--sh-lift); border-color:transparent;}
.homeCard:active{transform:translateY(-2px) scale(.985);}
.homeCard-icon{width:40px; height:40px; border-radius:14px; font-size:19px; margin-bottom:12px;}
.homeCard-titulo{font-size:14px;}
.homeCard-desc{font-size:12px;}

footer{border-top:1px solid #E6E8EB;}

/* --- celular --- */
@media (max-width:780px){
  .shell{padding:10px; gap:10px;}
  .sidebar{width:100%; height:auto; position:static; border-radius:20px; padding:10px;}
  .procTabs button{white-space:nowrap; padding:9px 13px;}
  .procTabs button.active{border-bottom-color:transparent;}
  .layout{grid-template-columns:1fr;}
  .rail{flex-direction:row;}
}

/* --- si el sistema pide menos movimiento --- */
@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{transition:none !important; animation:none !important;}
}
</style>

  const reader = new FileReader();
  reader.onload = (evt)=>{
    const data = new Uint8Array(evt.target.result);

    const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:''});

let __ptrInput = null;
document.addEventListener('mousedown', (e)=>{
  const t = e.target && e.target.closest ? e.target.closest('input[data-idx]') : null;
  __ptrInput = t ? {idx:t.dataset.idx, campo:t.dataset.campo||''} : null;
}, true);
function keepTableView(body, rerender, opts){
  const sc = body.querySelector('.scroll');
  const top = sc ? sc.scrollTop : 0;
  const ptr = __ptrInput; __ptrInput = null;
  rerender();
  const sc2 = body.querySelector('.scroll');
  if(sc2) sc2.scrollTop = top;
  // foco: primero lo que pidió el teclado (Tab/Enter); si no, el campo donde se hizo clic con el ratón
  if(opts && opts.focusPos!=null){
    const nuevos = body.querySelectorAll(opts.selector);
    const d = nuevos[opts.focusPos];
    if(d){ d.focus(); d.select(); }
  } else if(ptr){
    const el = body.querySelector('input[data-idx="'+ptr.idx+'"]'+(ptr.campo?'[data-campo="'+ptr.campo+'"]':''));
    if(el){ el.focus({preventScroll:true}); el.select(); }
  }
}

/* ---------- lectura del reporte (clave y existencia) ---------- */
function VautoMatch(st, rows){
  st.reportCols.rawRows = rows;
  let headerRow = -1;
  for(let i=0;i<Math.min(rows.length,15);i++){
    const joined = rows[i].join(' ').toLowerCase();
    if(joined.includes('clave') || joined.includes('artículo') || joined.includes('articulo')){ headerRow = i; break; }
  }
  if(headerRow<0) headerRow = 0;
  st.reportCols.headerRow = headerRow;
  const headers = rows[headerRow] || [];
  st.reportCols.headers = headers;
  let claveCol = headers.findIndex(h=>/clave/i.test(h));
  let existCol = headers.findIndex(h=>/exist/i.test(h));
  if(claveCol<0) claveCol = 0;
  if(existCol<0) existCol = Math.min(11, headers.length-1);
  VejecutarMatch(st, claveCol, existCol);
}

function VejecutarMatch(st, claveCol, existCol){
  const rows = st.reportCols.rawRows.slice(st.reportCols.headerRow+1);
  const mapText = new Map(), mapNumeric = new Map();
  const reportEntries = [];
  const SKIP_ROW = /^(l[ií]nea|almac[eé]n|\d+\s+art[íi]culos|total\s+\d+\s+art[íi]culos|solo\s+existencias)/i;
  rows.forEach(r=>{
    const rawClave = r[claveCol];
    if(rawClave===undefined || rawClave==='') return;
    const claveTxt = String(rawClave).trim();
    if(SKIP_ROW.test(claveTxt)) return;
    const cl = limpiaClave(rawClave);
    const ex = parseNum(r[existCol]);
    const exN = isNaN(ex)?0:ex;
    mapText.set(cl, {ex:exN});
    const asNum = parseFloat(cl);
    if(!isNaN(asNum)) mapNumeric.set(String(asNum), {ex:exN});
    let nombre='';
    for(let c=claveCol+1; c<existCol; c++){
      const v = r[c];
      if(v!==undefined && v!==null && String(v).trim()!==''){ nombre=String(v).trim(); break; }
    }
    reportEntries.push({claveOriginal:claveTxt, claveNorm:cl, existencia:exN, nombre});
  });
  st.rows = CATALOGO_VERDURA.map(p=>{
    const cl = limpiaClave(p.c);
    let hit = null;
    if(mapText.has(cl)) hit = mapText.get(cl);
    else {
      const asNum = parseFloat(cl);
      if(!isNaN(asNum) && mapNumeric.has(String(asNum))) hit = mapNumeric.get(String(asNum));
    }
    return {n:p.n, c:p.c, sistema:hit?hit.ex:0, matched:!!hit, real:null, resta:null};
  });
  const catalogNormSet = new Set(CATALOGO_VERDURA.map(p=>limpiaClave(p.c)));
  const catalogNumericSet = new Set(CATALOGO_VERDURA.map(p=>{ const n=parseFloat(limpiaClave(p.c)); return isNaN(n)?null:String(n); }).filter(x=>x!==null));
  st.extras = reportEntries.filter(e=>{
    if(catalogNormSet.has(e.claveNorm)) return false;
    const asNum = parseFloat(e.claveNorm);
    if(!isNaN(asNum) && catalogNumericSet.has(String(asNum))) return false;
    return true;
  }).map(e=>({clave:e.claveOriginal, nombre:e.nombre, existencia:e.existencia, decision:null}));
  st.captureIndex = 0;
}

function VsetReal(st, idx, val){
  const r = st.rows[idx];
  const v = parseNum(val);
  if(val==='' || val===null || isNaN(v)){ r.real = null; r.resta = null; }
  else { r.real = v; r.resta = Math.round((r.sistema - v)*10000000000)/10000000000; }
}
function VrestaTxt(resta){
  if(resta===null) return '&nbsp;';
  if(resta > V_EPS) return 'FALTA '+fmtNum(resta)+' (Salida)';
  if(resta < -V_EPS) return 'SOBRA '+fmtNum(Math.abs(resta))+' (Entrada)';
  return 'Sin diferencia';
}

/* ---------- MODO "BUSCAR Y PESAR" (ajuste mensual con báscula) ----------
   Flujo: existencias cargadas → buscar por nombre o código → capturar el peso →
   Resta = Sistema − Peso (misma fórmula de siempre) → Entrada o Salida.
   Solo entran a los archivos las verduras que se pesaron. */
function VnormTxt(s){
  return String(s==null?'':s).toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
}
function VbuscarMatches(st, q){
  const raw = String(q||'').trim();
  if(!raw) return [];
  const tokens = VnormTxt(raw).split(/\s+/).filter(Boolean);
  const qClave = limpiaClave(raw);
  const qNum = /^\d+$/.test(raw) ? parseFloat(raw) : null;
  const out = [];
  st.rows.forEach((r, idx)=>{
    const nom = VnormTxt(r.n), cod = limpiaClave(r.c);
    const cn = parseFloat(cod);
    const mismoNumero = qNum!==null && !isNaN(cn) && cn===qNum;
    const todo = nom + ' ' + VnormTxt(r.c);
    if(!mismoNumero && !tokens.every(t=>todo.includes(t))) return;
    let score = 3;
    if(cod===qClave || mismoNumero) score = 0;
    else if(cod.startsWith(qClave)) score = 1;
    else if(nom.startsWith(tokens[0])) score = 2;
    out.push({idx, score, nom});
  });
  out.sort((a,b)=> a.score-b.score || a.nom.localeCompare(b.nom));
  return out.map(o=>o.idx);
}
/* unidad de medida del reporte (KG, PZA...) si el reporte trae la columna "U. med" */
function VunidadesMapa(st){
  const rc = st.reportCols;
  if(st._unidadesDe === rc.rawRows && st._unidades) return st._unidades;
  const map = new Map();
  st._unidadesDe = rc.rawRows; st._unidades = map;
  if(!rc.rawRows) return map;
  const H = (rc.headers||[]).map(h=>String(h==null?'':h).trim());
  const uc = H.findIndex(h=>/^u\.?\s*med/i.test(h));
  if(uc<0) return map;
  let cc = H.findIndex(h=>/clave/i.test(h)); if(cc<0) cc = 0;
  rc.rawRows.slice(rc.headerRow+1).forEach(r=>{
    const k = limpiaClave(r[cc]);
    const u = String(r[uc]==null?'':r[uc]).trim();
    if(!k || !u) return;
    map.set(k, u);
    const n = parseFloat(k); if(!isNaN(n)) map.set(String(n), u);
  });
  return map;
}
function VunidadDe(st, r){
  const m = VunidadesMapa(st);
  const k = limpiaClave(r.c);
  if(m.has(k)) return m.get(k);
  const n = parseFloat(k);
  return (!isNaN(n) && m.has(String(n))) ? m.get(String(n)) : '';
}
function VsyncModo(st){
  [['vBtnModeBuscar','buscar'],['vBtnModeStepper','stepper'],['vBtnModeTabla','tabla']].forEach(pair=>{
    const b = document.getElementById(pair[0]);
    if(b) b.className = 'btn small' + (st.captureMode===pair[1] ? '' : ' secondary');
  });
  const bs = document.getElementById('vBuscador');
  if(bs) bs.style.display = st.captureMode==='buscar' ? 'none' : '';
}

function VrenderBuscar(st){
  const body = document.getElementById('vCaptureBody');
  if(!body) return;
  if(st.buscarSel===undefined || st.buscarSel===null || !st.rows[st.buscarSel]) st.buscarSel = null;
  body.innerHTML = `
    <div class="buscar-wrap">
      <label class="f" for="vBuscarBox">Buscar verdura por nombre o código</label>
      <input type="text" id="vBuscarBox" class="buscar-box" placeholder="Escribe el nombre o escanea el código…" autocomplete="off" spellcheck="false">
      <div id="vBuscarMsg"></div>
      <div id="vBuscarRes"></div>
      <div id="vPesoCard"></div>
      <div id="vCapList" style="margin-top:22px;"></div>
    </div>
  `;
  const box = document.getElementById('vBuscarBox');
  const msg = document.getElementById('vBuscarMsg');
  let hi = 0, matches = [];

  function pintarRes(){
    const res = document.getElementById('vBuscarRes');
    if(!res) return;
    if(st.buscarSel!==null){ res.innerHTML = ''; matches = []; return; }
    const q = box.value;
    if(!q.trim()){
      matches = [];
      res.innerHTML = `<div class="buscar-hint">Escribe parte del nombre o el código y pulsa Enter para elegir.</div>`;
      return;
    }
    matches = VbuscarMatches(st, q).slice(0, 8);
    if(hi >= matches.length) hi = 0;
    if(!matches.length){
      res.innerHTML = `<div class="callout warn">No encontré «${q.trim()}» en tu catálogo. Si está en el reporte pero no en el catálogo, revisa el botón «fuera de catálogo».</div>`;
      return;
    }
    res.innerHTML = `<div class="buscar-list">${matches.map((idx,i)=>{
      const r = st.rows[idx];
      return `<button type="button" class="buscar-item ${i===hi?'on':''}" data-idx="${idx}">
        <span class="bi-n">${r.n}</span><span class="bi-c">${r.c}</span>
        <span class="bi-s">Sistema ${fmtNum(r.sistema)}${VunidadDe(st,r)?' '+VunidadDe(st,r):''}</span>
        ${r.real!==null ? `<span class="pill green">pesada: ${fmtNum(r.real)}</span>` : '<span></span>'}
      </button>`;
    }).join('')}</div>`;
    res.querySelectorAll('.buscar-item').forEach(b=>{ b.onclick = ()=>elegir(parseInt(b.dataset.idx,10)); });
  }

  function previewPeso(){
    const pb = document.getElementById('vPesoBox'), pv = document.getElementById('vPesoPrev');
    if(!pb || !pv || st.buscarSel===null) return;
    const r = st.rows[st.buscarSel];
    const v = parseNum(pb.value);
    if(pb.value.trim()==='' || isNaN(v)){ pv.className = 'resta'; pv.innerHTML = '&nbsp;'; return; }
    const resta = Math.round((r.sistema - v)*10000000000)/10000000000;
    pv.className = 'resta ' + (resta > V_EPS ? 'pos' : 'neg');
    pv.innerHTML = VrestaTxt(resta);
  }

  function pintarCard(){
    const c = document.getElementById('vPesoCard');
    if(!c) return;
    if(st.buscarSel===null){ c.innerHTML = ''; return; }
    const r = st.rows[st.buscarSel];
    const u = VunidadDe(st, r);
    c.innerHTML = `
      <div class="capture peso-card">
        <div class="peso-head">
          <div>
            <span class="clave-tag">CLAVE ${r.c}</span>
            <div class="nombre">${r.n}</div>
          </div>
          <button type="button" class="btn secondary small" id="vPesoCancel">Cancelar (Esc)</button>
        </div>
        <div class="sistema">Sistema: <b>${fmtNum(r.sistema)}${u?' '+u:''}</b>
          ${!r.matched ? ' <span class="pill amber">no viene en el reporte</span>' : ''}
          ${r.real!==null ? ` <span class="pill green">ya pesada: ${fmtNum(r.real)} — se actualizará</span>` : ''}
        </div>
        <div>
          <input type="text" inputmode="decimal" class="real" id="vPesoBox" placeholder="Peso real${u?' ('+u+')':''}" value="${r.real===null?'':fmtNum(r.real)}" autocomplete="off">
          <div class="resta" id="vPesoPrev">&nbsp;</div>
          <div class="peso-err" id="vPesoErr"></div>
        </div>
        <div class="navrow"><span></span><button type="button" class="btn" id="vPesoGuardar">Guardar y buscar otra (Enter)</button></div>
      </div>
    `;
    const pb = document.getElementById('vPesoBox');
    pb.addEventListener('input', ()=>{ document.getElementById('vPesoErr').textContent = ''; previewPeso(); });
    pb.addEventListener('keydown', (e)=>{
      if(e.key==='Enter'){ e.preventDefault(); guardar(); }
      else if(e.key==='Escape'){ e.preventDefault(); cancelar(); }
    });
    document.getElementById('vPesoGuardar').onclick = guardar;
    document.getElementById('vPesoCancel').onclick = cancelar;
    previewPeso();
  }

  function pintarLista(){
    const cont = document.getElementById('vCapList');
    if(!cont) return;
    const caps = st.rows.map((r,i)=>({r:r, i:i})).filter(o=>o.r.real!==null)
      .sort((a,b)=> (b.r.tcap||0)-(a.r.tcap||0) || a.i-b.i);
    if(!caps.length){
      cont.innerHTML = `<div class="callout">Todavía no has pesado nada. Busca una verdura para empezar.</div>`;
      return;
    }
    const sal = caps.filter(o=>o.r.resta > V_EPS).length;
    const ent = caps.filter(o=>o.r.resta < -V_EPS).length;
    const sd = caps.length - sal - ent;
    cont.innerHTML = `
      <div class="toolbar">
        <h3 style="margin:0;">Pesadas</h3>
        <span class="pill green">${caps.length}</span>
        <span class="pill tomato">${sal} Salidas</span>
        <span class="pill amber">${ent} Entradas</span>
        ${sd ? `<span class="pill">${sd} sin diferencia</span>` : ''}
      </div>
      <div class="scroll" style="max-height:320px;"><table class="cap-tabla">
        <thead><tr><th>Verdura</th><th class="num-cell">Sistema</th><th class="num-cell">Peso real</th><th>Resultado</th><th></th></tr></thead>
        <tbody>${caps.map(o=>{
          const r = o.r, u = VunidadDe(st, r);
          const res = r.resta > V_EPS ? `<span class="pill tomato">Salida ${fmtNum(r.resta)}</span>`
                    : r.resta < -V_EPS ? `<span class="pill green">Entrada ${fmtNum(Math.abs(r.resta))}</span>`
                    : `<span class="pill">Sin diferencia</span>`;
          return `<tr>
            <td><b>${r.n}</b> <span style="color:var(--ink-soft); font-size:11.5px;">${r.c}</span></td>
            <td class="num-cell">${fmtNum(r.sistema)}${u?' '+u:''}</td>
            <td class="num-cell">${fmtNum(r.real)}</td>
            <td>${res}</td>
            <td class="cap-acc"><button type="button" class="btn secondary small" data-edit="${o.i}">Editar</button> <button type="button" class="btn secondary small" data-del="${o.i}">Quitar</button></td>
          </tr>`;
        }).join('')}</tbody>
      </table></div>
    `;
    cont.querySelectorAll('[data-edit]').forEach(b=>{ b.onclick = ()=>elegir(parseInt(b.dataset.edit,10)); });
    cont.querySelectorAll('[data-del]').forEach(b=>{
      b.onclick = ()=>{
        const idx = parseInt(b.dataset.del,10);
        VsetReal(st, idx, '');
        st.rows[idx].tcap = 0;
        if(st.buscarSel===idx){ st.buscarSel = null; pintarCard(); }
        msg.innerHTML = '';
        pintarRes(); pintarLista();
      };
    });
  }

  function elegir(idx){
    st.buscarSel = idx;
    box.value = ''; hi = 0; msg.innerHTML = '';
    pintarRes(); pintarCard();
    const pb = document.getElementById('vPesoBox');
    if(pb){ pb.focus(); pb.select(); }
  }
  function cancelar(){
    st.buscarSel = null; hi = 0;
    pintarCard(); pintarRes();
    box.focus();
  }
  function guardar(){
    const pb = document.getElementById('vPesoBox'), err = document.getElementById('vPesoErr');
    if(!pb || st.buscarSel===null) return;
    const v = parseNum(pb.value);
    if(pb.value.trim()==='' || isNaN(v)){ err.textContent = 'Escribe el peso (solo números).'; pb.focus(); return; }
    if(v < 0){ err.textContent = 'El peso no puede ser negativo.'; pb.focus(); pb.select(); return; }
    const idx = st.buscarSel, r = st.rows[idx];
    VsetReal(st, idx, pb.value);
    st.buscarSeq = (st.buscarSeq||0) + 1;
    r.tcap = st.buscarSeq;
    st.buscarSel = null; box.value = ''; hi = 0;
    msg.innerHTML = `<div class="callout" style="margin:10px 0;">✓ <b>${r.n}</b> guardada — ${VrestaTxt(r.resta)}</div>`;
    pintarCard(); pintarRes(); pintarLista();
    box.focus();
  }

  box.addEventListener('input', ()=>{
    if(st.buscarSel!==null){ st.buscarSel = null; pintarCard(); }
    msg.innerHTML = ''; hi = 0;
    pintarRes();
  });
  box.addEventListener('keydown', (e)=>{
    if(e.key==='ArrowDown'){ if(matches.length){ e.preventDefault(); hi = (hi+1) % matches.length; pintarRes(); } }
    else if(e.key==='ArrowUp'){ if(matches.length){ e.preventDefault(); hi = (hi-1+matches.length) % matches.length; pintarRes(); } }
    else if(e.key==='Enter'){ e.preventDefault(); if(matches.length) elegir(matches[hi]); }
    else if(e.key==='Escape'){ e.preventDefault(); box.value = ''; hi = 0; pintarRes(); }
  });

  pintarRes(); pintarCard(); pintarLista();
  if(st.buscarSel!==null){
    const pb = document.getElementById('vPesoBox');
    if(pb){ pb.focus(); pb.select(); }
  } else { box.focus(); }
}

function VrenderCaptureBody(st, filterQ){
  const body = document.getElementById('vCaptureBody');
  if(!body) return;
  VsyncModo(st);
  if(st.captureMode==='buscar') return VrenderBuscar(st);
  const total = st.rows.length;
  const capturados = st.rows.filter(r=>r.real!==null).length;

  if(st.captureMode==='tabla'){
    let idxs = st.rows.map((r,i)=>i);
    if(filterQ) idxs = idxs.filter(i=>(st.rows[i].n+' '+st.rows[i].c).toUpperCase().includes(filterQ));
    body.innerHTML = `
      <div class="progress-bar"><div class="fill" style="width:${(capturados/total*100).toFixed(0)}%"></div></div>
      <div class="scroll" style="max-height:420px;"><table>
        <thead><tr><th>Producto</th><th>Clave</th><th class="num-cell">Sistema</th><th class="num-cell">Real</th><th class="num-cell">Resta</th></tr></thead>
        <tbody>${idxs.map(i=>{
          const r = st.rows[i];
          const color = r.resta===null ? '' : (r.resta>V_EPS ? 'color:var(--tomato);' : (r.resta<-V_EPS ? 'color:var(--green);' : ''));
          return `<tr>
            <td>${r.n}</td><td>${r.c}</td>
            <td class="num-cell">${fmtNum(r.sistema)}</td>
            <td class="num-cell"><input type="text" inputmode="decimal" data-idx="${i}" class="vRealInput" style="width:74px;" value="${r.real===null?'':fmtNum(r.real)}"></td>
            <td class="num-cell" style="font-weight:700; ${color}">${r.resta===null?'':fmtNum(r.resta)}</td>
          </tr>`;
        }).join('')}</tbody>
      </table></div>
      <div class="callout">${capturados} de ${total} capturados · Resta positiva = faltante (genera Salida) · negativa = sobrante (genera Entrada).</div>
    `;
    body.querySelectorAll('.vRealInput').forEach((inp,pos)=>{
      inp.addEventListener('change', (e)=>{ VsetReal(st, parseInt(e.target.dataset.idx,10), e.target.value); keepTableView(body, ()=>VrenderCaptureBody(st, filterQ)); });
      inp.addEventListener('keydown', (e)=>{
        if(e.key==='Tab' || e.key==='Enter'){
          e.preventDefault();
          VsetReal(st, parseInt(inp.dataset.idx,10), inp.value);
          keepTableView(body, ()=>VrenderCaptureBody(st, filterQ), {selector:'.vRealInput', focusPos: (e.key==='Tab' && e.shiftKey) ? pos-1 : pos+1});
        }
      });
    });
    return;
  }

  if(st.captureIndex >= total) st.captureIndex = total-1;
  if(st.captureIndex < 0) st.captureIndex = 0;
  const i = st.captureIndex;
  const r = st.rows[i];
  body.innerHTML = `
    <div class="progress-bar"><div class="fill" style="width:${((i+1)/total*100).toFixed(0)}%"></div></div>
    <div class="capture">
      <div style="text-align:center;">
        <div class="nombre">${r.n}</div>
        <div class="sistema">Sistema: ${fmtNum(r.sistema)} · ${i+1} de ${total} · ${capturados} capturados</div>
      </div>
      <div>
        <input type="text" inputmode="decimal" class="real" id="vRealBox" placeholder="Cantidad real" value="${r.real===null?'':fmtNum(r.real)}">
        <div class="resta ${r.resta!==null && r.resta>V_EPS?'pos':'neg'}" id="vRestaPreview">${VrestaTxt(r.resta)}</div>
      </div>
      <div class="navrow">
        <button class="btn secondary" id="vBtnAnterior" ${i===0?'disabled':''}>← Anterior</button>
        <button class="btn" id="vBtnSiguiente">${i===total-1?'Finalizar':'Siguiente →'}</button>
      </div>
    </div>
  `;
  const realBox = document.getElementById('vRealBox');
  const preview = document.getElementById('vRestaPreview');
  realBox.focus(); realBox.select();
  realBox.addEventListener('input', ()=>{
    const v = parseNum(realBox.value);
    if(realBox.value==='' || isNaN(v)){ preview.innerHTML = '&nbsp;'; return; }
    const resta = Math.round((r.sistema - v)*10000000000)/10000000000;
    preview.className = 'resta ' + (resta>V_EPS ? 'pos' : 'neg');
    preview.innerHTML = VrestaTxt(resta);
  });
  realBox.addEventListener('keydown', (e)=>{ if(e.key==='Enter'){ e.preventDefault(); goNext(); } });
  document.getElementById('vBtnSiguiente').onclick = goNext;
  document.getElementById('vBtnAnterior').onclick = ()=>{ VsetReal(st, i, realBox.value); if(i>0){ st.captureIndex--; VrenderCaptureBody(st); } };
  function goNext(){
    VsetReal(st, i, realBox.value);
    if(i < total-1){ st.captureIndex++; VrenderCaptureBody(st); }
    else { st.maxStepReached = Math.max(st.maxStepReached, 3); VfinishBanner(st); }
  }
}

function VfinishBanner(st){
  const body = document.getElementById('vCaptureBody');
  const pendientes = st.rows.filter(r=>r.real===null).length;
  body.innerHTML = `
    <div class="callout ${pendientes?'warn':''}">${pendientes ? `Quedan <b>${pendientes}</b> productos sin capturar — no se incluirán en los archivos.` : 'Terminaste de capturar todos los productos.'}</div>

      <button class="btn secondary" id="vBtnRevisar">Revisar en tabla</button>

  document.getElementById('vBtnRevisar').onclick = ()=>{ st.captureMode='tabla'; VrenderCaptureBody(st); };
  document.getElementById('vBtnAGenerar').onclick = ()=>{ st.step=3; render(); };
}

function VgetSalidasEntradas(st){
  const capturados = st.rows.filter(r=>r.real!==null);
  const salidas = capturados.filter(r=>r.resta > V_EPS);
  const entradas = capturados.filter(r=>r.resta < -V_EPS);
  const bajasExtras = (st.extras||[]).filter(e=>e.decision==='baja' && e.existencia > V_EPS).map(e=>({c:e.clave, n:e.nombre||e.clave, resta:e.existencia}));
  return {capturados, salidas, entradas, bajasExtras, salidasTotal: salidas.concat(bajasExtras)};
}

function Vdescargar(rows, filename, cantFn){
  const aoa = [[]];
  rows.forEach(r=>{ aoa.push([r.c, cantFn(r)]); });
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Sheet1');
  XLSX.writeFile(wb, filename);
}

/* =====================================================================
   PROCESO: ANÁLISIS DE VERDURA
   Carga la "Relación del inventario" de mermas (una o varias) y saca el
   Top de verduras que más pérdida generan (costo + unidades).
   ===================================================================== */
function AVparse(rows){
  let headerRow=-1, claveCol=0;
  for(let i=0;i<Math.min(rows.length,20);i++){
    for(let c=0;c<rows[i].length;c++){
      const v = String(rows[i][c]==null?'':rows[i][c]).trim().toLowerCase();
      if(v==='artículo' || v==='articulo' || v==='clave'){ headerRow=i; claveCol=c; break; }
    }
    if(headerRow>=0) break;
  }
  if(headerRow<0){ headerRow=5; claveCol=0; }
  const header = rows[headerRow] || [];
  const find = (re)=>{ for(let c=0;c<header.length;c++){ if(re.test(String(header[c]==null?'':header[c]).trim())) return c; } return -1; };
  const unidadesCol = find(/^(unidades|cantidad)$/i);
  const costoUnitCol = find(/costo\s*unit/i);
  const costoTotalCol = find(/costo\s*total|^importe$|^total$/i);
  const unidadMedCol = find(/^u\.?\s*med/i);
  const SKIP = /^(\d+\s+art[íi]culos|total\s+\d+\s+art[íi]culos|total|l[ií]nea|concepto|almac[eé]n)/i;
  const productos = [];
  for(let i=headerRow+1; i<rows.length; i++){
    const r = rows[i];
    const clave = r[claveCol];
    if(clave===undefined || clave===null || String(clave).trim()==='') continue;
    const claveTxt = String(clave).trim();
    if(SKIP.test(claveTxt)) continue;
    let nombre='';
    const hasta = unidadMedCol>claveCol ? unidadMedCol : (unidadesCol>claveCol ? unidadesCol : claveCol+4);
    for(let c=claveCol+1; c<hasta; c++){
      const v = r[c];
      if(v!==undefined && v!==null && String(v).trim()!=='' && isNaN(parseNum(v))){ nombre=String(v).trim(); break; }
    }
    const un = unidadesCol>=0 ? parseNum(r[unidadesCol]) : NaN;
    const cu = costoUnitCol>=0 ? parseNum(r[costoUnitCol]) : NaN;
    let ct = costoTotalCol>=0 ? parseNum(r[costoTotalCol]) : NaN;
    if(isNaN(ct) && !isNaN(un) && !isNaN(cu)) ct = un*cu;
    if(isNaN(un) && isNaN(ct)) continue;
    productos.push({clave:claveTxt, nombre, unidades:isNaN(un)?0:un, costoTotal:isNaN(ct)?0:ct});
  }
  return {productos, cols:{unidades:unidadesCol, costoUnit:costoUnitCol, costoTotal:costoTotalCol}};
}

function AVcatalogoIndex(){
  const txt = new Map(), num = new Map();
  CATALOGO_VERDURA.forEach(p=>{
    const cl = limpiaClave(p.c);
    txt.set(cl, p.n);
    const n = parseFloat(cl);
    if(!isNaN(n)) num.set(String(n), p.n);
  });
  return {txt, num};
}
function AVenCatalogo(idx, clave){
  const cl = limpiaClave(clave);
  if(idx.txt.has(cl)) return idx.txt.get(cl);
  const n = parseFloat(cl);
  if(!isNaN(n) && idx.num.has(String(n))) return idx.num.get(String(n));
  return null;
}

function AVcalcular(st){
  const idx = AVcatalogoIndex();
  const acum = new Map();
  st.archivos.forEach(a=>{
    a.productos.forEach(p=>{
      const k = limpiaClave(p.clave);
      const nomCat = AVenCatalogo(idx, p.clave);
      if(!acum.has(k)) acum.set(k, {clave:p.clave, nombre:p.nombre||nomCat||p.clave, unidades:0, costoTotal:0, esVerdura:nomCat!==null});
      const e = acum.get(k);
      e.unidades += p.unidades; e.costoTotal += p.costoTotal;
      if(!e.nombre && p.nombre) e.nombre = p.nombre;
    });
  });
  const todos = Array.from(acum.values());
  const verduras = todos.filter(e=>e.esVerdura);
  const fuera = todos.filter(e=>!e.esVerdura);
  const ex = st.excluidas || {};
  const lista = (st.soloCatalogo ? verduras : todos).map(e=>({
    clave:e.clave, nombre:e.nombre,
    unidades:Math.round(e.unidades*10000000000)/10000000000,
    costoTotal:Math.round(e.costoTotal*100)/100
  })).filter(e=>e.costoTotal>0 || e.unidades>0);
  const usados = lista.filter(e=>!ex[limpiaClave(e.clave)]);
  const excepciones = lista.filter(e=>ex[limpiaClave(e.clave)])
    .map(e=>Object.assign({}, e, {motivo: ex[limpiaClave(e.clave)]}))
    .sort((a,b)=>b.costoTotal-a.costoTotal);
  const costoExcepciones = Math.round(excepciones.reduce((s,p)=>s+p.costoTotal,0)*100)/100;
  const unidadesExcepciones = Math.round(excepciones.reduce((s,p)=>s+p.unidades,0)*10000000000)/10000000000;
  const totalCosto = Math.round(usados.reduce((s,p)=>s+p.costoTotal,0)*100)/100;
  const totalUnidades = Math.round(usados.reduce((s,p)=>s+p.unidades,0)*10000000000)/10000000000;
  const costoFuera = Math.round(fuera.reduce((s,p)=>s+p.costoTotal,0)*100)/100;
  return {datos:{productos:usados, totalCosto, totalUnidades}, excepciones, costoExcepciones, unidadesExcepciones, fuera:fuera.length, costoFuera, totalArticulos:todos.length};
}

  aoa.push(['Análisis de pérdida Verdura — generado '+fechaHoy()]);
  aoa.push([]);
  aoa.push(['Verdura Pérdida TOP '+st.topN]);
  aoa.push(['Codigo','Nombre','Costo','Costo Sumado','Cantidad']);
  top.forEach(p=> aoa.push([p.clave, p.nombre, p.costoTotal, costoSumado, p.unidades]));

  const det = [['Clave','Verdura','Unidades perdidas','Costo pérdida']];
  datos.productos.slice().sort((a,b)=>b.costoTotal-a.costoTotal).forEach(p=> det.push([p.clave, p.nombre, p.unidades, p.costoTotal]));
  const ws2 = XLSX.utils.aoa_to_sheet(det);
  ws2['!cols'] = [{wch:16},{wch:40},{wch:16},{wch:14}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Perdida Verdura');
  XLSX.utils.book_append_sheet(wb, ws2, 'Detalle');
  if(calc.excepciones.length){
    const exa = [['Clave','Verdura','Unidades','Costo','Motivo']];
    calc.excepciones.forEach(p=> exa.push([p.clave, p.nombre, p.unidades, p.costoTotal, p.motivo]));

    XLSX.utils.book_append_sheet(wb, ws3, 'Excepciones');
  }
  XLSX.writeFile(wb, 'Analisis_Perdida_Verdura_'+fechaHoy()+'.xlsx');

/* ---- parseo del reporte crudo "Resultado del inventario físico" ----
   Formato Microsip: 2 filas por producto (cantidades / costos), con celdas combinadas —
   la posición exacta de cada columna varía según el reporte, así que se detecta sola
   leyendo los encabezados de la fila 6/7 en vez de asumir columnas fijas.
*/
function MdetectarColumnas(rows, headerRow){
  const hdr = rows[headerRow] || [];
  function buscarCol(regex, fallback){
    for(let i=0;i<hdr.length;i++){
      if(hdr[i] && regex.test(String(hdr[i]))) return i;
    }
    return fallback;
  }
  const unidadCol = buscarCol(/^u\.?\s*med/i, 2);
  const entradasCol = buscarCol(/^entradas/i, 3);
  const salidasCol = buscarCol(/^salidas/i, 4);
  const invFinalCol = buscarCol(/inventario\s*final/i, 5);

  // nombreCol: primera celda no vacía entre la columna 1 y la de unidad, en el primer renglón de producto real
  let nombreCol = 1;
  const LINEA = /^l[ií]nea/i, TOTAL_ROW = /^\d+\s+art[íi]culos\s+en/i;
  for(let i=headerRow+1; i<rows.length; i++){
    const a = rows[i][0];
    if(a===undefined || a===null || String(a).trim()==='') continue;
    const aTxt = String(a).trim();
    if(LINEA.test(aTxt) || TOTAL_ROW.test(aTxt)) continue;
    const r = rows[i];
    for(let ci=1; ci<unidadCol; ci++){
      if(r[ci]!==undefined && r[ci]!==null && r[ci]!==''){ nombreCol = ci; break; }
    }
    break;
  }
  return {nombreCol, unidadCol, entradasCol, salidasCol, invFinalCol};
}

function MparseReporte(rows){
  let headerRow = -1;
  for(let i=0;i<Math.min(rows.length,15);i++){
    const a = String(rows[i][0]||'').trim().toLowerCase();
    if(a==='artículo' || a==='articulo'){ headerRow = i; break; }
  }
  if(headerRow<0) headerRow = 6; // fallback: fila 7 (índice 6), como en los reportes vistos

  let fecha = '', linea = '';
  for(let i=0;i<Math.min(headerRow+4, rows.length);i++){
    const a = String(rows[i][0]||'').trim();
    if(/^al\s+\d/i.test(a)) fecha = a;
    if(/^l[ií]nea/i.test(a)) linea = a.replace(/^l[ií]nea:?\s*/i,'');
  }

  const cols = MdetectarColumnas(rows, headerRow);
  const productos = [];
  const costIndex = {};
  const TOTAL_ROW = /^\d+\s+art[íi]culos\s+en/i;
  for(let i=headerRow+1; i<rows.length; i++){
    const r = rows[i];
    const clave = r[0];
    if(clave===undefined || clave===null || String(clave).trim()==='') continue;
    const claveTxt = String(clave).trim();
    if(/^l[ií]nea/i.test(claveTxt)) continue;   // fila "Línea: ..." — no es un producto
    if(TOTAL_ROW.test(claveTxt)) break;          // fila de totales al final del reporte — de aquí en adelante ya no hay productos
    const nombre = r[cols.nombreCol]!==undefined ? r[cols.nombreCol] : '';
    const unidad = r[cols.unidadCol];
    const entradas = parseNum(r[cols.entradasCol]);
    const salidas = parseNum(r[cols.salidasCol]);
    const teorico = parseNum(r[cols.invFinalCol]);
    const next = rows[i+1];
    let costRow = null;
    if(next && (next[0]===undefined || next[0]===null || String(next[0]).trim()==='')){
      const camposCosto = [cols.entradasCol, cols.salidasCol, cols.invFinalCol];
      const hasNums = camposCosto.some(ci => next[ci]!=='' && next[ci]!=null && !isNaN(parseNum(next[ci])));
      if(hasNums){
        costRow = { entradasCosto: parseNum(next[cols.entradasCol]), salidasCosto: parseNum(next[cols.salidasCol]), invFinalCosto: parseNum(next[cols.invFinalCol]) };
      }
    }
    const claveL = String(clave).trim();
    const salidasNum = isNaN(salidas)?0:salidas;
    let costoUnitario = null;
    if(costRow && costRow.salidasCosto!=null && !isNaN(costRow.salidasCosto) && salidasNum>0){
      costoUnitario = costRow.salidasCosto / salidasNum;
    }
    productos.push({
      clave: claveL, nombre: String(nombre||'').trim(), unidad,
      entradas: isNaN(entradas)?0:entradas, salidas: salidasNum, teorico: isNaN(teorico)?0:teorico,
      costoUnitario,
      pasillo:null, bodega:null, real:null, diferencia:null, etiqueta:null, montoMerma:null, pista:null
    });
    costIndex[limpiaClave(claveL)] = costRow;
  }
  return {productos, costIndex, meta:{fecha, linea}};
}

    <div class="toolbar">

      <button class="btn secondary small" id="mBtnModeTabla">Vista de tabla (ordenada por Salidas)</button>

function Mrectificar(r){
  const TOL = 0.000001;
  const diff = Math.round((r.real - r.teorico)*10000000000)/10000000000;
  r.diferencia = diff;

  if(r.real < r.salidas - TOL){
    // Regla de negocio: si lo contado es menor a lo que el sistema dice que salió,
    // parte de esa "salida" nunca se vendió — es MERMA, sin importar si el ajuste
    // que hay que mandar a Microsip termine siendo Entrada o Salida.
    r.etiqueta = 'MERMA';
    const faltante = Math.round((r.salidas - r.real)*10000000000)/10000000000;
    r.perdida = faltante;
    r.montoMerma = (r.costoUnitario!=null) ? Math.round(faltante * r.costoUnitario * 100)/100 : null;
    r.pista = 'Real menor a Salidas: parte de lo registrado como vendido no salió realmente — pérdida';
  } else if(Math.abs(diff) <= TOL){
    r.etiqueta = 'NO impacta'; r.montoMerma = 0; r.perdida = 0; r.pista = 'Diferencia despreciable';
  } else if(diff < -TOL){
    r.etiqueta = 'MERMA'; r.montoMerma = Math.round(Math.abs(diff)*100)/100; r.perdida = Math.abs(diff);
    if(r.salidas>0 && r.entradas===0) r.pista = 'Faltante vs teórico; posible venta/salida no dada de baja total';
    else if(r.salidas===0 && r.entradas===0) r.pista = 'Caducidad, rotura o merma física no registrada';
    else r.pista = 'Revisar movimientos: bajas/mermas no registradas';
  } else {
    r.etiqueta = 'Ajuste ENTRADA'; r.montoMerma = 0; r.perdida = 0;
    if(r.entradas>0 && r.salidas===0) r.pista = 'Sobrante vs teórico; posible entrada no registrada antes o sobreconteo previo';
    else r.pista = 'Revisar recepciones/entradas no registradas o conteo';
  }
}

function MrenderCaptureBody(st, filterQ){
  const body = document.getElementById('mCaptureBody');
  if(!body) return;
  const capturables = MgetCapturables(st);
  if(!capturables.length){
    body.innerHTML = `<div class="callout warn">Ningún producto de este reporte tiene Salidas mayor a ${SALIDAS_UMBRAL} — no hay nada que recontar.</div>`;
    return;
  }
  const capturados = capturables.filter(r=>r.real!==null).length;
  const total = capturables.length;

  if(st.captureMode==='tabla'){
    let rows = capturables.slice();
    if(filterQ) rows = rows.filter(r=>r.nombre.toUpperCase().includes(filterQ));
    body.innerHTML = `
      <div class="progress-bar"><div class="fill" style="width:${(capturados/total*100).toFixed(0)}%"></div></div>
      <div class="scroll"><table>
        <thead><tr><th>Producto</th><th>Clave</th><th class="num-cell">Salidas</th><th class="num-cell">Teórico</th><th class="num-cell">Pasillo</th><th class="num-cell">Bodega</th><th class="num-cell">Real</th><th class="num-cell">Dif. (Microsip)</th><th>Etiqueta</th><th class="num-cell">Pérdida (Sal.−Real)</th><th class="num-cell">Merma $</th></tr></thead>
        <tbody>${rows.map(r=>{
          const gi = st.productos.indexOf(r);
          const rowClass = r.etiqueta==='MERMA' ? 'rowMerma' : r.etiqueta==='Ajuste ENTRADA' ? 'rowAjuste' : '';
          return `<tr class="${rowClass}">
            <td>${r.nombre}</td><td>${r.clave}</td>
            <td class="num-cell" style="font-weight:700; color:var(--tomato); font-size:14px;">${fmtNum(r.salidas)}</td>
            <td class="num-cell">${fmtNum(r.teorico)}</td>
            <td class="num-cell"><input type="text" data-idx="${gi}" data-campo="pasillo" class="mCampoInput" style="width:64px;" value="${r.pasillo===null?'':fmtNum(r.pasillo)}"></td>
            <td class="num-cell"><input type="text" data-idx="${gi}" data-campo="bodega" class="mCampoInput" style="width:64px;" value="${r.bodega===null?'':fmtNum(r.bodega)}"></td>
            <td class="num-cell">${r.real===null?'':fmtNum(r.real)}</td>
            <td class="num-cell">${r.diferencia===null?'':fmtNum(r.diferencia)}</td>
            <td>${r.etiqueta?`<span class="pill ${r.etiqueta==='MERMA'?'tomato':r.etiqueta==='Ajuste ENTRADA'?'amber':'green'}">${r.etiqueta}</span>`:''}</td>
            <td class="num-cell">${r.etiqueta==='MERMA' ? fmtNum(r.perdida) : ''}</td>
            <td class="num-cell">${r.etiqueta==='MERMA' ? (r.montoMerma==null ? '<span class="pill amber">sin costo</span>' : '$'+fmtMoney(r.montoMerma)) : ''}</td>
          </tr>`;
        }).join('')}</tbody>
      </table></div>
    `;
    body.querySelectorAll('.mCampoInput').forEach((inp, pos)=>{
      inp.addEventListener('change', (e)=>{ MsetCampo(st, parseInt(e.target.dataset.idx,10), e.target.dataset.campo, e.target.value); keepTableView(body, ()=>MrenderCaptureBody(st, filterQ)); });
      inp.addEventListener('keydown', (e)=>{
        if(e.key==='Tab'){
          e.preventDefault();
          MsetCampo(st, parseInt(inp.dataset.idx,10), inp.dataset.campo, inp.value);
          keepTableView(body, ()=>MrenderCaptureBody(st, filterQ), {selector:'.mCampoInput', focusPos: e.shiftKey ? pos-1 : pos+1});
        }
      });
    });
    return;
  }

  const i = st.captureIndex;
  const r = capturables[i];
  const giReal = st.productos.indexOf(r);
  const diffPreview = r.real===null ? null : Math.round((r.real - r.teorico)*10000000000)/10000000000;
  body.innerHTML = `
    <div class="progress-bar"><div class="fill" style="width:${((i+1)/total*100).toFixed(0)}%"></div></div>
    <div class="capture">
      <div style="text-align:center;">
        <span class="clave-tag">CLAVE ${r.clave}</span>
        <div class="nombre">${r.nombre}</div>
        <div class="sistema">Teórico: ${fmtNum(r.teorico)} ${r.unidad||''} · Producto ${i+1} de ${total}</div>
        <div style="font-family:'Inter', sans-serif; font-size:26px; font-weight:700; color:var(--tomato); margin-top:6px;">Salidas: ${fmtNum(r.salidas)}</div>
      </div>
      <div>
        <div style="display:flex; gap:10px;">
          <div style="flex:1;"><label class="f" style="text-align:center;">Pasillo</label><input type="text" inputmode="decimal" class="real" id="mPasilloBox" placeholder="0" value="${r.pasillo===null?'':fmtNum(r.pasillo)}"></div>
          <div style="flex:1;"><label class="f" style="text-align:center;">Bodega</label><input type="text" inputmode="decimal" class="real" id="mBodegaBox" placeholder="0" value="${r.bodega===null?'':fmtNum(r.bodega)}"></div>
        </div>
        <div class="resta ${diffPreview>0?'neg':diffPreview<0?'pos':''}" id="mDiffPreview">${diffPreview===null?'&nbsp;':'DIFERENCIA: '+fmtNum(diffPreview)}</div>
      </div>
      <div class="navrow">
        <button class="btn secondary" id="mBtnAnterior" ${i===0?'disabled':''}>← Anterior</button>
        <button class="btn" id="mBtnSiguiente">${i===total-1?'Finalizar':'Siguiente →'}</button>
      </div>
    </div>
  `;
  const pasilloBox = document.getElementById('mPasilloBox');
  const bodegaBox = document.getElementById('mBodegaBox');
  const preview = document.getElementById('mDiffPreview');
  pasilloBox.focus(); pasilloBox.select();
  function livePreview(){
    const p = parseNum(pasilloBox.value); const b = parseNum(bodegaBox.value);
    if(isNaN(p) && isNaN(b)){ preview.innerHTML = '&nbsp;'; preview.className='resta'; return; }
    const real = (isNaN(p)?0:p) + (isNaN(b)?0:b);
    const diff = Math.round((real - r.teorico)*10000000000)/10000000000;
    preview.textContent = 'DIFERENCIA: '+fmtNum(diff);
    preview.className = 'resta ' + (diff>0?'neg':diff<0?'pos':'');
  }
  pasilloBox.addEventListener('input', livePreview);
  bodegaBox.addEventListener('input', livePreview);
  pasilloBox.addEventListener('keydown', (e)=>{ if(e.key==='Enter'){ e.preventDefault(); MsetCampo(st, giReal, 'pasillo', pasilloBox.value); bodegaBox.focus(); bodegaBox.select(); } });
  bodegaBox.addEventListener('keydown', (e)=>{ if(e.key==='Enter'){ e.preventDefault(); goNext(); } });
  document.getElementById('mBtnSiguiente').onclick = goNext;
  document.getElementById('mBtnAnterior').onclick = ()=>{ guardarAmbos(); if(i>0){ st.captureIndex--; MrenderCaptureBody(st); } };
  function guardarAmbos(){
    MsetCampo(st, giReal, 'pasillo', pasilloBox.value);
    MsetCampo(st, giReal, 'bodega', bodegaBox.value);
  }
  function goNext(){
    guardarAmbos();
    if(i < total-1){ st.captureIndex++; MrenderCaptureBody(st); }
    else { st.maxStepReached = Math.max(st.maxStepReached, 3); MfinishBanner(st); }
  }
}
function McomputeReal(r){
  if(r.pasillo===null && r.bodega===null){ r.real = null; }
  else { r.real = Math.round(((r.pasillo||0) + (r.bodega||0))*10000000000)/10000000000; }
}
function MsetCampo(st, idx, campo, val){
  const r = st.productos[idx];
  const v = parseNum(val);
  r[campo] = (val==='' || val===null || isNaN(v)) ? null : v;
  McomputeReal(r);
  if(r.real===null){ r.diferencia = null; r.etiqueta = null; r.montoMerma = null; r.perdida = null; r.pista = null; }
  else { Mrectificar(r); }
}
function MfinishBanner(st){
  const body = document.getElementById('mCaptureBody');
  const capturables = MgetCapturables(st);
  const pendientes = capturables.filter(r=>r.real===null).length;
  const merma = capturables.filter(r=>r.etiqueta==='MERMA').length;
  const ajuste = capturables.filter(r=>r.etiqueta==='Ajuste ENTRADA').length;
  const totalMermaAuto = capturables.reduce((s,r)=> s + (r.etiqueta==='MERMA' && r.montoMerma!=null ? r.montoMerma : 0), 0);
  body.innerHTML = `
    <div class="callout ${pendientes?'warn':''}">
      ${pendientes ? `Quedan <b>${pendientes}</b> productos sin capturar.` : 'Terminaste de capturar todos los productos.'}
      &nbsp; ${merma} MERMA (≈$${fmtMoney(totalMermaAuto)}) · ${ajuste} Ajuste ENTRADA.
    </div>
    <button class="btn secondary" id="mBtnRevisar">Revisar en tabla</button>
    <button class="btn" id="mBtnACosteo">Ir a costeo de diferencias →</button>
  `;
  document.getElementById('mBtnRevisar').onclick = ()=>{ st.captureMode='tabla'; MrenderCaptureBody(st); };
  document.getElementById('mBtnACosteo').onclick = ()=>{ st.step=3; render(); };
}

      <input type="text" id="mCosteoBuscador" placeholder="Filtrar por clave o nombre (opcional)..." style="min-width:260px;">

    <h3 style="margin-top:30px;">Cerrar la rectificación en Microsip</h3>

    MrenderCosteoResultados(st, q);

  document.getElementById('mBtnDescargarCosteo').onclick = ()=>MdescargarCosteo(st);

    const ws = XLSX.utils.aoa_to_sheet(aoa);

    XLSX.writeFile(wb, 'Entrada_Rectificacion_'+fechaHoy()+'.xlsx');

function MrenderCosteoResultados(st, q){
  const area = document.getElementById('mCosteoResultados');
  if(!area) return;
  const yaAgregados = new Set(st.costeo.map(c=>limpiaClave(c.clave)));
  let results = st.productos.filter(p=>!yaAgregados.has(limpiaClave(p.clave)));
  if(q) results = results.filter(p=> p.clave.toUpperCase().includes(q) || p.nombre.toUpperCase().includes(q));
  results = results.slice().sort((a,b)=>b.salidas-a.salidas);
  const mostrar = results.slice(0, 40);
  if(!mostrar.length){ area.innerHTML = `<div class="callout">Sin resultados.</div>`; return; }
  area.innerHTML = `
    <div class="callout">Selecciona directamente del reporte — ordenado por Salidas, de mayor a menor. Tú decides cuáles generaron pérdida.</div>
    <div class="scroll" style="max-height:320px;"><table>
    <thead><tr><th>Producto</th><th>Clave</th><th class="num-cell">Salidas</th><th class="num-cell">Pérdida (uds.)</th><th>Etiqueta</th><th></th></tr></thead>
    <tbody>${mostrar.map(p=>{
      const gi = st.productos.indexOf(p);
      const etTag = p.etiqueta ? `<span class="pill ${p.etiqueta==='MERMA'?'tomato':p.etiqueta==='Ajuste ENTRADA'?'amber':'green'}">${p.etiqueta}</span>` : '<span class="pill">sin capturar</span>';
      return `<tr><td>${p.nombre}</td><td>${p.clave}</td><td class="num-cell">${fmtNum(p.salidas)}</td><td class="num-cell">${p.etiqueta==='MERMA' ? fmtNum(p.perdida) : ''}</td><td>${etTag}</td><td><button class="btn small" data-idx="${gi}">Agregar</button></td></tr>`;
    }).join('')}</tbody>
  </table></div>
  ${results.length>mostrar.length ? `<div class="callout">Mostrando ${mostrar.length} de ${results.length} — usa el buscador para acotar.</div>` : ''}
  `;
  area.querySelectorAll('button[data-idx]').forEach(b=>{
    b.onclick = ()=>{
      const p = st.productos[parseInt(b.dataset.idx,10)];
      MagregarCosteo(st, p);
      MrenderCosteoResultados(st, st.buscador||'');
      MrenderCosteoTabla(st);
    };
  });
}

    sinCapturar: p.real===null,
    perdida: p.perdida!=null ? p.perdida : null,

    sinCosto: p.real!==null && p.montoMerma==null

  ${st.costeo.some(c=>c.sinCapturar) ? `<div class="callout warn">Los marcados en "sin capturar" no pasaron por el paso 2 (Salidas ≤ ${SALIDAS_UMBRAL} o no los tocaste) — captura ahí las unidades reales o ponlas a mano aquí.</div>` : ''}

/* ---- parseo del reporte "Existencia y valor del inventario — solo artículos con existencia negativa" ----
   Formato Microsip con celdas combinadas — las columnas se detectan solas leyendo los encabezados,
   igual que en el proceso del miércoles.
   Viene agrupado por "Línea: ..." y con renglones de subtotal ("N artículos en X", "N artículos con existencia negativa",
   "Total N artículos") que hay que ignorar.
*/
function NparseReporte(rows){
  let headerRow = -1;
  for(let i=0;i<Math.min(rows.length,15);i++){
    const a = String(rows[i][0]||'').trim().toLowerCase();
    if(a==='artículo' || a==='articulo'){ headerRow = i; break; }
  }
  if(headerRow<0) headerRow = 6;

  const hdr = rows[headerRow] || [];
  function buscarCol(regex, fallback){
    for(let i=0;i<hdr.length;i++){ if(hdr[i] && regex.test(String(hdr[i]))) return i; }
    return fallback;
  }
  const unidadCol = buscarCol(/^u\.?\s*med/i, 7);
  const existenciaCol = buscarCol(/^existencia/i, 11);
  const SKIP = /^(\d+\s+art[íi]culos|total\s+\d+\s+art[íi]culos)/i;
  const LINEA = /^l[ií]nea/i;

  let nombreCol = 1;
  for(let i=headerRow+1; i<rows.length; i++){
    const a = rows[i][0];
    if(a===undefined || a===null || String(a).trim()==='') continue;
    const aTxt = String(a).trim();
    if(LINEA.test(aTxt) || SKIP.test(aTxt)) continue;
    const r = rows[i];
    for(let ci=1; ci<unidadCol; ci++){
      if(r[ci]!==undefined && r[ci]!==null && r[ci]!==''){ nombreCol = ci; break; }
    }
    break;
  }

  const productos = [];
  let lineaActual = '';
  for(let i=headerRow+1; i<rows.length; i++){
    const r = rows[i];
    const a = r[0];
    if(a===undefined || a===null || String(a).trim()==='') continue;
    const aTxt = String(a).trim();
    if(LINEA.test(aTxt)){ lineaActual = aTxt.replace(/^l[ií]nea:?\s*/i,''); continue; }
    if(SKIP.test(aTxt)) continue;
    const nombre = r[nombreCol]!==undefined ? r[nombreCol] : '';
    const unidad = r[unidadCol];
    const existencia = parseNum(r[existenciaCol]);
    productos.push({
      clave: aTxt, nombre: String(nombre||'').trim(), unidad, linea: lineaActual,
      existencia: isNaN(existencia)?0:existencia,
      pasillo:null, bodega:null, real:null, entrada:null
    });
  }
  return productos;
}

function NStep1(panel, st){

    <p class="lead tag">En Microsip: Existencia y valor del inventario → filtrar "Solo artículos con existencia negativa" (todas las líneas).</p>
    <div class="callout">Sube aquí ese reporte (.xlsx / .xls).</div>
    <input type="file" id="nFileInput" accept=".xlsx,.xls,.xlsm">
    <div id="nParseArea"></div>
  `;
  document.getElementById('nFileInput').addEventListener('change', (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    readWorkbookRows(file, (rows)=>{
      st.productos = NparseReporte(rows);
      st.maxStepReached = Math.max(st.maxStepReached, 2);

}

function NStep2(panel, st){
  if(!st.productos.length){ panel.innerHTML = `<div class="callout bad">Primero carga el reporte en el paso 1.</div>`; return; }
  panel.innerHTML = `
    <div class="step-title"><h2>2. Captura de existencia real</h2></div>

    <div class="toolbar">
      <button class="btn secondary small" id="nBtnModeStepper">Uno por uno</button>
      <button class="btn secondary small" id="nBtnModeTabla">Vista de tabla</button>
      <div class="spacer"></div>
      <input type="text" id="nBuscador" placeholder="Buscar producto..." style="min-width:180px;">
      <button class="btn small" id="nBtnFinalizarYa">Finalizar aquí y generar archivo →</button>
    </div>
    <div id="nCaptureBody"></div>
  `;
  document.getElementById('nBtnFinalizarYa').onclick = ()=>{ st.step=3; render(); };
  document.getElementById('nBtnModeStepper').onclick = ()=>{ st.captureMode='stepper'; NrenderCaptureBody(st); };
  document.getElementById('nBtnModeTabla').onclick = ()=>{ st.captureMode='tabla'; NrenderCaptureBody(st); };
  document.getElementById('nBuscador').addEventListener('input', (e)=>{
    const q = e.target.value.trim().toUpperCase();
    if(!q){ if(st.captureMode==='tabla') NrenderCaptureBody(st); return; }
    if(st.captureMode==='stepper'){
      const idx = NgetOrdenados(st).findIndex(r=>r.nombre.toUpperCase().includes(q));
      if(idx>=0){ st.captureIndex = idx; NrenderCaptureBody(st); }
    } else { NrenderCaptureBody(st, q); }
  });
  NrenderCaptureBody(st);
}

function NcomputeReal(r){
  if(r.pasillo===null && r.bodega===null){ r.real = null; }
  else { r.real = Math.round(((r.pasillo||0) + (r.bodega||0))*10000000000)/10000000000; }
}
function NsetCampo(st, idx, campo, val){
  const r = st.productos[idx];
  const v = parseNum(val);
  r[campo] = (val==='' || val===null || isNaN(v)) ? null : v;
  NcomputeReal(r);
  r.entrada = r.real===null ? null : Math.round((r.real - r.existencia)*10000000000)/10000000000;
}

function NrenderCaptureBody(st, filterQ){
  const body = document.getElementById('nCaptureBody');
  if(!body) return;
  const ordenados = NgetOrdenados(st);
  const capturados = st.productos.filter(r=>r.real!==null).length;
  const total = st.productos.length;

  if(st.captureMode==='tabla'){
    let rows = ordenados;
    if(filterQ) rows = rows.filter(r=>r.nombre.toUpperCase().includes(filterQ));
    let lineaAnterior = null;
    const filas = [];
    rows.forEach(r=>{
      if(r.linea !== lineaAnterior){
        filas.push(`<tr><td colspan="6" style="background:var(--green-pale); color:var(--green-deep); font-weight:700; padding:6px 10px;">${r.linea || 'Sin línea'}</td></tr>`);
        lineaAnterior = r.linea;
      }
      const gi = st.productos.indexOf(r);
      filas.push(`<tr>
        <td>${r.nombre}</td><td>${r.clave}</td>
        <td class="num-cell" style="color:var(--tomato); font-weight:700;">${fmtNum(r.existencia)}</td>
        <td class="num-cell"><input type="text" data-idx="${gi}" data-campo="pasillo" class="nCampoInput" style="width:64px;" value="${r.pasillo===null?'':fmtNum(r.pasillo)}"></td>
        <td class="num-cell"><input type="text" data-idx="${gi}" data-campo="bodega" class="nCampoInput" style="width:64px;" value="${r.bodega===null?'':fmtNum(r.bodega)}"></td>
        <td class="num-cell">${r.entrada===null?'':fmtNum(r.entrada)}</td>
      </tr>`);
    });
    body.innerHTML = `
      <div class="progress-bar"><div class="fill" style="width:${(capturados/total*100).toFixed(0)}%"></div></div>
      <div class="scroll"><table>
        <thead><tr><th>Producto</th><th>Clave</th><th class="num-cell">Existencia</th><th class="num-cell">Pasillo</th><th class="num-cell">Bodega</th><th class="num-cell">Entrada</th></tr></thead>
        <tbody>${filas.join('')}</tbody>
      </table></div>
    `;
    body.querySelectorAll('.nCampoInput').forEach((inp, pos)=>{
      inp.addEventListener('change', (e)=>{ NsetCampo(st, parseInt(e.target.dataset.idx,10), e.target.dataset.campo, e.target.value); keepTableView(body, ()=>NrenderCaptureBody(st, filterQ)); });
      inp.addEventListener('keydown', (e)=>{
        if(e.key==='Tab'){
          e.preventDefault();
          NsetCampo(st, parseInt(inp.dataset.idx,10), inp.dataset.campo, inp.value);

        }
      });
    });
    return;
  }

  const i = st.captureIndex;
  const r = ordenados[i];
  const giReal = st.productos.indexOf(r);
  const entradaPreview = r.real===null ? null : Math.round((r.real - r.existencia)*10000000000)/10000000000;
  body.innerHTML = `
    <div class="progress-bar"><div class="fill" style="width:${((i+1)/total*100).toFixed(0)}%"></div></div>
    <div class="capture">
      <div style="text-align:center;">
        <span class="clave-tag">CLAVE ${r.clave}</span>
        <div class="nombre">${r.nombre}</div>
        <div class="sistema">${r.linea?r.linea+' · ':''}Producto ${i+1} de ${total}</div>
        <div style="font-family:'Inter', sans-serif; font-size:26px; font-weight:700; color:var(--tomato); margin-top:6px;">Existencia: ${fmtNum(r.existencia)}</div>
      </div>
      <div>
        <div style="display:flex; gap:10px;">
          <div style="flex:1;"><label class="f" style="text-align:center;">Pasillo</label><input type="text" inputmode="decimal" class="real" id="nPasilloBox" placeholder="0" value="${r.pasillo===null?'':fmtNum(r.pasillo)}"></div>
          <div style="flex:1;"><label class="f" style="text-align:center;">Bodega</label><input type="text" inputmode="decimal" class="real" id="nBodegaBox" placeholder="0" value="${r.bodega===null?'':fmtNum(r.bodega)}"></div>
        </div>
        <div class="resta neg" id="nEntradaPreview">${entradaPreview===null?'&nbsp;':'ENTRADA: '+fmtNum(entradaPreview)}</div>
      </div>
      <div class="navrow">
        <button class="btn secondary" id="nBtnAnterior" ${i===0?'disabled':''}>← Anterior</button>
        <button class="btn" id="nBtnSiguiente">${i===total-1?'Finalizar':'Siguiente →'}</button>
      </div>
    </div>
  `;
  const pasilloBox = document.getElementById('nPasilloBox');
  const bodegaBox = document.getElementById('nBodegaBox');
  const preview = document.getElementById('nEntradaPreview');
  pasilloBox.focus(); pasilloBox.select();
  function livePreview(){
    const p = parseNum(pasilloBox.value); const b = parseNum(bodegaBox.value);
    if(isNaN(p) && isNaN(b)){ preview.innerHTML = '&nbsp;'; return; }
    const real = (isNaN(p)?0:p) + (isNaN(b)?0:b);
    preview.textContent = 'ENTRADA: '+fmtNum(Math.round((real - r.existencia)*10000000000)/10000000000);
  }
  pasilloBox.addEventListener('input', livePreview);
  bodegaBox.addEventListener('input', livePreview);
  pasilloBox.addEventListener('keydown', (e)=>{ if(e.key==='Enter'){ e.preventDefault(); NsetCampo(st, giReal, 'pasillo', pasilloBox.value); bodegaBox.focus(); bodegaBox.select(); } });

  function guardarAmbos(){
    NsetCampo(st, giReal, 'pasillo', pasilloBox.value);
    NsetCampo(st, giReal, 'bodega', bodegaBox.value);
  }
  function goNext(){
    guardarAmbos();
    if(i < total-1){ st.captureIndex++; NrenderCaptureBody(st); }
    else { st.maxStepReached = Math.max(st.maxStepReached, 3); NfinishBanner(st); }
  }
}

const __charts = {};

/* ---- parseo del reporte "Relaciones del inventario" filtrado por Concepto ----
   Formato: Clave(A), Nombre(offset+2), U.med, Unidades, Costo unitario, Costo total.
   Trae una fila de total al final ("Total N artículos") que se ignora.
*/
function AparseMerma(rows){
  let headerRow=-1, claveCol=0;
  for(let i=0;i<Math.min(rows.length,15);i++){
    for(let c=0;c<rows[i].length;c++){
      const v = String(rows[i][c]||'').trim().toLowerCase();
      if(v==='artículo' || v==='articulo'){ headerRow=i; claveCol=c; break; }
    }
    if(headerRow>=0) break;
  }
  if(headerRow<0){ headerRow=5; claveCol=0; }
  const header = rows[headerRow];
  function findCol(regex){
    for(let c=0;c<header.length;c++){ if(regex.test(String(header[c]||'').trim())) return c; }
    return -1;
  }
  const unidadCol = findCol(/^u\.?\s*med/i);
  const unidadesCol = findCol(/^unidades$/i);
  const costoUnitCol = findCol(/costo\s*unitario/i);
  const costoTotalCol = findCol(/costo\s*total/i);
  const SKIP = /^(\d+\s+art[íi]culos|total\s+\d+\s+art[íi]culos)/i;

  const productos = [];
  for(let i=headerRow+1; i<rows.length; i++){
    const r = rows[i];
    const clave = r[claveCol];
    if(clave===undefined || clave===null || String(clave).trim()==='') continue;
    const claveTxt = String(clave).trim();
    if(SKIP.test(claveTxt)) continue;
    let nombre='';
    for(let c=claveCol+1; c<unidadCol; c++){
      const v = r[c];
      if(v!==undefined && v!==null && String(v).trim()!==''){ nombre=String(v).trim(); break; }
    }
    const unidades = parseNum(r[unidadesCol]);
    const costoUnit = parseNum(r[costoUnitCol]);
    const costoTotal = parseNum(r[costoTotalCol]);
    productos.push({
      clave: claveTxt, nombre,
      unidades: isNaN(unidades)?0:unidades,
      costoUnit: isNaN(costoUnit)?0:costoUnit,
      costoTotal: isNaN(costoTotal)?0:costoTotal
    });
  }
  const totalCosto = productos.reduce((s,p)=>s+p.costoTotal,0);
  const totalUnidades = productos.reduce((s,p)=>s+p.unidades,0);
  return {productos, totalCosto, totalUnidades};
}

function AtopYVarios(datos, topN){
  const ordenados = datos.productos.slice().sort((a,b)=>b.costoTotal-a.costoTotal);
  const top = ordenados.slice(0, topN);
  const topCosto = top.reduce((s,p)=>s+p.costoTotal,0);
  const topUnidades = top.reduce((s,p)=>s+p.unidades,0);
  const variosCosto = Math.round((datos.totalCosto - topCosto)*100)/100;
  const variosUnidades = Math.round((datos.totalUnidades - topUnidades)*10000000000)/10000000000;
  const restoCount = datos.productos.length - top.length;
  return {top, variosCosto, variosUnidades, restoCount};
}

        ${top.map((p,i)=>`<tr><td>${i+1}</td><td>${p.clave}</td><td>${p.nombre}</td><td class="num-cell">${fmtNum(p.unidades)}</td><td class="num-cell">$${fmtMoney(p.costoTotal)}</td></tr>`).join('')}
        <tr><td></td><td></td><td><b>VARIOS</b> (${restoCount} artículos)</td><td class="num-cell">${fmtNum(variosUnidades)}</td><td class="num-cell">$${fmtMoney(variosCosto)}</td></tr>
      </tbody>
    </table></div>
  `;
  ApintarChart(chartId, titulo, top, variosCosto, datos.totalCosto, colorVar);
}

function ApintarChart(chartId, titulo, top, variosCosto, totalCosto, colorVar){
  const canvas = document.getElementById(chartId);
  if(!canvas || typeof Chart==='undefined') return;
  if(__charts[chartId]){ __charts[chartId].destroy(); }
  const labels = top.map(p=> p.nombre.length>22 ? p.nombre.slice(0,22)+'…' : p.nombre).concat(['VARIOS']);
  const costos = top.map(p=>p.costoTotal).concat([variosCosto]);
  let acumulado = 0;
  const cumPct = costos.map(c=>{ acumulado += c; return totalCosto>0 ? Math.round((acumulado/totalCosto)*1000)/10 : 0; });
  const barColor = colorVar==='tomato' ? '#E0583F' : '#F2994A';
  __charts[chartId] = new Chart(canvas.getContext('2d'), {
    data: {
      labels,
      datasets: [
        { type:'bar', label:'Costo', data: costos, backgroundColor: barColor, yAxisID:'y', order:2 },
        { type:'line', label:'% acumulado', data: cumPct, borderColor:'#1B4332', backgroundColor:'#1B4332', yAxisID:'y1', tension:0.25, order:1, pointRadius:3 }
      ]
    },
    options: {
      responsive:true,
      plugins:{ title:{ display:true, text: titulo }, legend:{ position:'bottom' } },
      scales:{
        y:{ beginAtZero:true, title:{ display:true, text:'Costo ($)' } },
        y1:{ beginAtZero:true, max:100, position:'right', grid:{ drawOnChartArea:false }, title:{ display:true, text:'% acumulado' } }
      }
    }
  });
}

/* =====================================================================
   PROCESO: INVENTARIO MENSUAL (SAM'S, USA, WALMART, o cualquier otro)
   ===================================================================== */
function ZparseReporte(rows){
  let headerRow=-1, claveCol=0;
  for(let i=0;i<Math.min(rows.length,15);i++){
    for(let c=0;c<rows[i].length;c++){
      const v = String(rows[i][c]||'').trim().toLowerCase();
      if(v==='artículo' || v==='articulo'){ headerRow=i; claveCol=c; break; }
    }
    if(headerRow>=0) break;
  }
  if(headerRow<0){ headerRow=6; claveCol=0; }
  const header = rows[headerRow];
  function findCol(regex){
    for(let c=0;c<header.length;c++){ if(regex.test(String(header[c]||'').trim())) return c; }
    return -1;
  }
  const unidadCol = findCol(/^u\.?\s*med/i);
  let existCol = findCol(/^existencia$/i);
  if(existCol<0) existCol = findCol(/exist/i);
  if(existCol<0) existCol = claveCol+5;
  const uCol = unidadCol<0 ? claveCol+2 : unidadCol;

  const SKIP = /^(\d+\s+art[íi]culos|total\s+\d+\s+art[íi]culos)/i;
  const LINEA = /^l[ií]nea/i;
  const productos = [];
  let lineaActual = '';
  for(let i=headerRow+1; i<rows.length; i++){
    const r = rows[i];
    const a = r[claveCol];
    if(a===undefined || a===null || String(a).trim()==='') continue;
    const aTxt = String(a).trim();
    if(LINEA.test(aTxt)){ lineaActual = aTxt.replace(/^l[ií]nea:?\s*/i,''); continue; }
    if(SKIP.test(aTxt)) continue;
    let nombre='';
    for(let c=claveCol+1; c<uCol; c++){
      const v = r[c];
      if(v!==undefined && v!==null && String(v).trim()!==''){ nombre=String(v).trim(); break; }
    }
    const unidad = r[uCol];
    const existencia = parseNum(r[existCol]);
    productos.push({
      clave: aTxt, nombre, unidad, linea: lineaActual,
      existencia: isNaN(existencia)?0:existencia,
      pasillo:null, bodega:null, real:null, diferencia:null
    });
  }
  return productos;
}
